[build]
  command = "npm run build"
  publish = "out"

# Netlify's default is Node 22 these days, but pinning it makes the build
# reproducible and avoids a silent toolchain switch.
[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # The site is a pure static export: no API routes, no server rendering.
  # This is the same switch the local `npm run build:static` uses.
  ABZARO_EXPORT = "1"

# Next's static export emits directory-style URLs (/tools/doc-invoice/index.html),
# so clean URLs need no rewrite rules. Anything unknown should land on the 404
# page Next generated rather than Netlify's own.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
